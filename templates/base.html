{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FoxTale{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">
        {% include 'partials/nav.html' %}
        <div class="col-md-9 col-lg-10 d-flex flex-column">
            <header class="text-center py-4">
                <a href="{% url 'home' %}" class="logo">
                    <img src="{% static 'images/logo.svg' %}" alt="FoxTale">
                    <span>FoxTale</span>
                </a>
            </header>
            <main class="flex-grow-1 px-md-4">
                {% block content %}{% endblock %}
            </main>
            {% include 'partials/footer.html' %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
