{% extends 'base.html' %}

{% block title %}Изтриване | FoxTale{% endblock %}

{% block content %}
    <h1 class="mb-3">Изтриване на статия</h1>
    <p>Сигурен ли си, че искаш да изтриеш „{{ article.title }}“?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, изтрий</button>
        <a href="{% url 'article-detail' article.pk %}" class="btn btn-link">Назад</a>
    </form>
{% endblock %}
