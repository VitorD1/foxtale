<form method="post" enctype="multipart/form-data" class="fox-form">
    {% csrf_token %}
    {% for error in form.non_field_errors %}
        <div class="error mb-3">{{ error }}</div>
    {% endfor %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
            {{ field }}
            {% if field.help_text %}
                <small class="text-muted d-block">{{ field.help_text }}</small>
            {% endif %}
            {% for error in field.errors %}
                <div class="error">{{ error }}</div>
            {% endfor %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-fox">{{ button }}</button>
</form>
